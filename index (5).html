function dash(){return '<div class="grid">'+[['4','مشاريع جارية'],['38','قطعة مصبوبة اليوم'],['12','مهندس موقع'],['7','استحقاقات بانتظار التدقيق']].map(function(x){return '<div class="card stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div><h2>نسب الإنجاز</h2><div class="card">'+PR.map(function(p){return '<div style="margin-bottom:16px"><div class="prow"><span>'+p[0]+'</span><b>'+p[1]+'%</b></div><div class="bar"><i style="width:'+p[1]+'%"></i></div></div>'}).join('')+'</div><p style="color:var(--mute);font-size:14px">أرقام تجريبية لعرض الشكل فقط.</p>'}
function settings(){tmp=Object.assign({},S);
return '<div class="two"><form class="form card" id="sf"><label>اسم الشركة<input type="text" id="fn" value="'+esc(S.name)+'"></label><label>اللون الأساسي<span class="row"><input type="color" id="fc" value="'+S.color+'"><span id="fh" dir="ltr">'+S.color+'</span></span></label><label>الشعار (PNG أو JPG أو SVG، حتى 2MB)<input type="file" id="ff" accept="image/png,image/jpeg,image/svg+xml"></label><div class="row"><button type="button" class="btn p" id="sv">حفظ التغييرات</button><button type="button" class="btn" id="rs">استرجاع الافتراضي</button></div></form><div><b>معاينة مباشرة</b><div class="prev" style="margin-top:8px"><div class="brand"><div class="logo" id="pl"></div><div class="bname" id="pn"></div></div><div class="pill">عنصر نشط</div></div></div></div>'}
function prev(){$('pn').textContent=tmp.name||'—';var l=$('pl');l.style.background=tmp.color;l.style.color=onC(tmp.color);l.innerHTML=tmp.logo?'<img alt="" src="'+tmp.logo+'">':'';if(!tmp.logo)l.textContent=(tmp.name||'ر').trim().charAt(0);var p=document.querySelector('.pill');p.style.background=tmp.color;p.style.color=onC(tmp.color)}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function bindSet(){prev();
$('fn').oninput=function(){tmp.name=this.value;prev()};
$('fc').oninput=function(){tmp.color=this.value;$('fh').textContent=this.value;prev()};
$('ff').onchange=function(){var f=this.files[0];if(!f)return;if(f.size>2097152){toast('حجم الشعار أكبر من 2MB');this.value='';return}fitLogo(f,function(d){tmp.logo=d;prev()})};
$('sv').onclick=function(){if(!tmp.name.trim()){toast('اكتب اسم الشركة');return}S=Object.assign({},tmp);applyId(S);ls('id',JSON.stringify(S));saveId(S)};
$('rs').onclick=function(){S=Object.assign({},DEF);applyId(S);ls('id',JSON.stringify(S));render();saveId(S)}}
function render(){if(!me)return;var cur=buildNav();$('title').textContent=P[cur][0];var h;
if(cur==='dash')h=dash();else if(cur==='settings')h=settings();else if(cur==='users')h=usersPage();
else h=empty('هذه الصفحة تجي بمرحلة لاحقة','الهيكل جاهز، والمحتوى ينضاف حسب خطة المراحل.');
$('page').innerHTML=h;if(cur==='settings')bindSet();if(cur==='users')bindUsers();
$('uname').textContent=me.name;$('urole').textContent=R[role][0];$('av').textContent=me.name.trim().charAt(0)}
function setOpen(o){if(innerWidth<768)$('app').classList.remove('collapsed');$('app').classList.toggle('open',o);document.body.classList.toggle('lock',o&&innerWidth<768);
if(o&&!history.state)history.pushState({m:1},'');}
$('menu').onclick=function(){setOpen(true)};$('ov').onclick=$('closeb').onclick=function(){if(history.state&&history.state.m)history.back();else setOpen(false)};
$('nav').onclick=function(e){if(e.target.closest('.chev')){subOpen=!subOpen;buildNav();return}if(e.target.closest('a')&&innerWidth<768){setTimeout(function(){setOpen(false);if(history.state&&history.state.m)history.replaceState(null,'')},0)}};
$('q').oninput=buildNav;
addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();if(innerWidth<768)setOpen(true);$('q').focus()}});
addEventListener('popstate',function(){setOpen(false)});
addEventListener('hashchange',render);
$('collapse').onclick=function(){var c=$('app').classList.toggle('collapsed');if(innerWidth>=768)ls('col',c?'1':'0')};
try{var sv=ls('id');if(sv)S=Object.assign(S,JSON.parse(sv))}catch(e){}
var wasDesk=innerWidth>=768;function syncCol(){$('app').classList.toggle('collapsed',innerWidth>=768&&ls('col')==='1')}syncCol();addEventListener('resize',function(){var d=innerWidth>=768;if(d!==wasDesk){wasDesk=d;syncCol()}});

var me=null,auth,db,sec,unsubS=null,unsubU=null,lm='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var _ai=applyId;applyId=function(s){_ai(s);$('nameL').textContent=s.name||'';$('logoL').innerHTML=$('logoS').innerHTML};
function cfgOK(){return FIREBASE_CONFIG.apiKey.indexOf('PASTE')<0}
function errAr(e){var m={'auth/invalid-credential':'الإيميل أو كلمة السر غير صحيحة','auth/wrong-password':'الإيميل أو كلمة السر غير صحيحة','auth/user-not-found':'الإيميل أو كلمة السر غير صحيحة','auth/invalid-email':'صيغة الإيميل غير صحيحة','auth/too-many-requests':'محاولات كثيرة، انتظر شوي وجرب مرة ثانية','auth/network-request-failed':'ماكو اتصال بالإنترنت','auth/email-already-in-use':'هذا الإيميل مسجل من قبل','auth/weak-password':'كلمة السر لازم 6 أحرف على الأقل','permission-denied':'ما عندك صلاحية لهذا الإجراء'};return m[e.code]||('صار خطأ: '+(e.code||e.message))}
function showLogin(msg){document.body.classList.remove('in');$('splash').hidden=true;$('login').hidden=false;$('lerr').textContent=msg||'';$('page').innerHTML=''}
function fitLogo(f,cb){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var w=im.width||256,h=im.height||256,k=Math.min(1,256/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/png'))};im.onerror=function(){toast('الملف غير صالح')};im.src=u}
function saveId(s){db.doc('settings/company').set({name:s.name,color:s.color,logo:s.logo||'',updatedBy:me.uid,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){toast('تم حفظ الهوية')}).catch(function(e){toast('ما انحفظت: '+errAr(e))})}
function roleOpts(sel){return Object.keys(R).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+R[k][0]+'</option>'}).join('')}
function usersPage(){return '<div class="row" style="justify-content:space-between;margin-bottom:14px"><span class="mu" style="font-size:13px">أنت تضيف الموظفين وتحدد أدوارهم. ماكو تسجيل ذاتي.</span><button class="btn p" id="addu">إضافة مستخدم</button></div><div id="uform"></div><div id="ulist" class="grid ug"></div>'}
function bindUsers(){if(unsubU)unsubU();
$('addu').onclick=showUF;
$('ulist').onclick=function(e){var t=e.target.closest('button');if(!t)return;
if(t.dataset.t)db.doc('users/'+t.dataset.t).update({active:t.dataset.a!=='1'}).catch(function(x){toast(errAr(x))});
if(t.dataset.r)auth.sendPasswordResetEmail(t.dataset.r).then(function(){toast('انرسل رابط تغيير كلمة السر')}).catch(function(x){toast(errAr(x))})};
$('ulist').onchange=function(e){var t=e.target.closest('select');if(t)db.doc('users/'+t.dataset.id).update({role:t.value}).then(function(){toast('تم تغيير الدور')}).catch(function(x){toast(errAr(x))})};
unsubU=db.collection('users').onSnapshot(function(q){var a=[];q.forEach(function(d){var x=d.data();x.id=d.id;a.push(x)});a.sort(function(p,r){return (p.name||'').localeCompare(r.name||'','ar')});
$('ulist').innerHTML=a.map(function(x){var me2=x.id===me.uid;return '<div class="card uc"><div class="prow"><b>'+esc(x.name)+'</b><span class="chip'+(x.active?'':' off')+'">'+(x.active?'فعّال':'موقوف')+'</span></div><small dir="ltr" class="mu">'+esc(x.email)+'</small><select class="sel" data-id="'+x.id+'" aria-label="الدور"'+(me2?' disabled':'')+'>'+roleOpts(x.role)+'</select><div class="row"><button class="btn sm" data-t="'+x.id+'" data-a="'+(x.active?'1':'0')+'"'+(me2?' disabled':'')+'>'+(x.active?'إيقاف':'تفعيل')+'</button><button class="btn sm" data-r="'+esc(x.email)+'">رابط تغيير كلمة السر</button></div></div>'}).join('')},function(x){$('ulist').innerHTML='<div class="card empty"><h3>ما كدرت أحمّل المستخدمين</h3><p>'+esc(errAr(x))+'</p></div>'})}
function showUF(){$('uform').innerHTML='<form class="card form" id="nf" style="margin-bottom:16px"><label>الاسم<input type="text" id="nn" required></label><label>الإيميل<input type="text" inputmode="email" dir="ltr" id="ne" autocomplete="off" required></label><label>كلمة سر مؤقتة (6 أحرف أو أكثر)<input type="text" dir="ltr" id="np" autocomplete="off" required></label><label>الدور<select id="nr" class="sel">'+roleOpts('site')+'</select></label><p class="err" id="nerr" role="alert"></p><div class="row"><button class="btn p" id="nsv">إنشاء الحساب</button><button type="button" class="btn" id="ncx">إلغاء</button></div></form>';
$('nn').focus();$('ncx').onclick=function(){$('uform').innerHTML=''};
$('nf').onsubmit=function(e){e.preventDefault();var b=$('nsv'),nm=$('nn').value.trim(),em=$('ne').value.trim(),rl=$('nr').value;b.disabled=true;$('nerr').textContent='';
if(!sec)sec=firebase.initializeApp(FIREBASE_CONFIG,'sec');var sa=sec.auth();
sa.createUserWithEmailAndPassword(em,$('np').value).then(function(c){return db.doc('users/'+c.user.uid).set({name:nm,email:em,role:rl,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:me.uid}).then(function(){return sa.signOut()})}).then(function(){$('uform').innerHTML='';toast('تم إنشاء حساب '+nm)}).catch(function(x){$('nerr').textContent=errAr(x);b.disabled=false})}}
function boot(){
if(!cfgOK()){$('splash').hidden=true;$('login').hidden=false;$('lform').hidden=true;$('lerr').textContent='لازم تلصق إعدادات Firebase داخل الملف (FIREBASE_CONFIG) قبل التشغيل.';return}
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
$('lform').onsubmit=function(e){e.preventDefault();var b=$('lbtn');b.disabled=true;$('lerr').textContent='';auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value).catch(function(x){$('lerr').textContent=errAr(x)}).then(function(){b.disabled=false})};
$('lforgot').onclick=function(){var m=$('le').value.trim();if(!m){$('lerr').textContent='اكتب الإيميل أولاً';return}auth.sendPasswordResetEmail(m).then(function(){$('lerr').textContent='انرسل رابط تغيير كلمة السر لإيميلك'}).catch(function(x){$('lerr').textContent=errAr(x)})};
$('logout').onclick=function(){auth.signOut()};
auth.onAuthStateChanged(function(u){
if(unsubS){unsubS();unsubS=null}if(unsubU){unsubU();unsubU=null}
if(!u){me=null;showLogin(lm);lm='';return}
db.doc('users/'+u.uid).get().then(function(d){var x=d.exists?d.data():null;
if(!x||!x.active||!R[x.role]){lm=!x?'حسابك غير مسجل بالنظام. إذا أنت المدير الأول، هذا الـ UID لمستندك بـ Firestore:\n'+u.uid:'حسابك موقوف أو دوره غير معروف، راجع المدير العام';auth.signOut();return}
me={uid:u.uid,name:x.name||u.email};role=x.role;
unsubS=db.doc('settings/company').onSnapshot(function(q){if(q.exists){var v=q.data();if(v.logo&&v.logo.indexOf('data:image/')!==0)v.logo='';S=Object.assign({},DEF,v);ls('id',JSON.stringify(S));applyId(S)}});
var ids=R[role][1].split(' ');if(ids.indexOf((location.hash||'').slice(1))<0)location.hash='#'+ids[0];
$('login').hidden=true;$('splash').hidden=true;document.body.classList.add('in');render()
}).catch(function(e){lm=errAr(e);auth.signOut()})})}
applyId(S);boot();
</script>
</body>
</html>
