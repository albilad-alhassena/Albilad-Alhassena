async function reconcile(id){if(!confirm('إعادة احتساب الصب من سجل الصبّات؟'))return;try{var sn=await db.collection('pours').where('projectId','==',id).get(),m={},t=0;sn.forEach(function(d){var x=d.data();m[x.productId]=(m[x.productId]||0)+x.count;t+=x.count});await db.doc('projects/'+id).update({pouredBy:m,poured:t});toast('تم الاحتساب: '+nf(t)+' قطعة')}catch(e){toast(errAr(e))}}
function initPours(){if(!pdate)pdate=today();
$('pt').innerHTML='<div class="row" style="justify-content:space-between;align-items:end;margin-bottom:12px"><label style="max-width:200px">التاريخ<input type="date" id="pd1" value="'+pdate+'"></label><button class="btn p" id="np2">تسجيل صبة</button></div><div id="pform"></div>';
$('pd1').onchange=function(){pdate=this.value||today();listenSP();drawPours()};
$('np2').onclick=function(){pourForm()};
$('vb').onclick=function(e){var b=e.target.closest('[data-pe]');if(b)pourForm(b.dataset.pe)}}
function drawPours(){if(!$('vb'))return;var n=SP.reduce(function(t,x){return t+x.count},0),L=SP.slice().sort(function(a,b){return tms(b.createdAt)-tms(a.createdAt)});
$('vb').innerHTML='<div class="card stat" style="margin-bottom:12px"><span>مجموع الصب بتاريخ '+esc(pdate)+'</span><b>'+nf(n)+' قطعة</b></div>'+(L.length?'<div class="grid ug">'+L.map(function(x){var g=x.log&&x.log.length?x.log[x.log.length-1]:null;return '<div class="card pc"><div class="prow"><b>'+esc(x.productName)+'</b><b>'+nf(x.count)+'</b></div><div class="mu" style="font-size:13px">'+esc(x.projectName||'')+'</div>'+(x.notes?'<div class="mu" style="font-size:13px">'+esc(x.notes)+'</div>':'')+(g?'<div class="mu" style="font-size:12px">عُدّلت '+x.log.length+' مرة • آخرها: '+nf(g.from)+' ← '+nf(g.to)+'</div>':'')+'<div><button class="btn sm" data-pe="'+x.id+'">تعديل</button></div></div>'}).join('')+'</div>':empty('ماكو صب مسجل بهذا التاريخ','اضغط "تسجيل صبة".'))}
function pourForm(id){var x=id?SP.filter(function(p){return p.id===id})[0]:null;if(id&&!x)return;var P=PRJ.filter(function(p){return !p.archived&&(p.status||'active')==='active'});
if(!id&&!P.length){toast('ماكو مشروع جاري معيّن عليك');return}
$('pform').innerHTML='<form class="card form" id="pf5" style="margin-bottom:16px"><h3 style="margin:0">'+(id?'تعديل الصبة':'تسجيل صبة')+'</h3>'
+(id?'<div class="mu">'+esc(x.projectName)+' • '+esc(x.productName)+'</div>':'<label>المشروع<select class="sel" id="pr1">'+P.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label><label>المنتج<select class="sel" id="pr2"></select></label><div class="mu" id="pr3" style="font-size:13px"></div>')
+fld('العدد المصبوب','pr4','number',id?x.count:'',1)+fld('ملاحظات','pr5','text',id?x.notes:'')+'<p class="err" id="pr6" role="alert"></p><div class="row"><button class="btn p" id="pr7">حفظ</button><button type="button" class="btn" id="pr8">إلغاء</button></div></form>';
$('pr8').onclick=function(){$('pform').innerHTML=''};
if(!id){var gp=function(){return PRJ.filter(function(q){return q.id===$('pr1').value})[0]},fr=function(){var p=gp(),m=p&&(p.products||[]).filter(function(q){return q.id===$('pr2').value})[0],d=m?((p.pouredBy||{})[m.id]||0):0;$('pr3').textContent=m?'مصبوب '+nf(d)+' من '+nf(m.quantity)+' • المتبقي '+nf(Math.max(0,m.quantity-d)):''},fp=function(){var p=gp();$('pr2').innerHTML=((p&&p.products)||[]).map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join('');fr()};$('pr1').onchange=fp;$('pr2').onchange=fr;fp()}
$('pf5').onsubmit=function(e){e.preventDefault();var n=+$('pr4').value;if(!Number.isInteger(n)||n<(id?0:1)){$('pr6').textContent='اكتب عدد صحيح'+(id?' (0 لإلغاء الصبة)':' أكبر من صفر');return}
var F=firebase.firestore.FieldValue,bt=db.batch(),T=F.serverTimestamp(),notes=$('pr5').value.trim(),proj,pid,ref,old=0;
if(id){proj=x.projectId;pid=x.productId;ref=db.doc('pours/'+id);old=x.count;bt.update(ref,{count:n,notes:notes,updatedAt:T,log:F.arrayUnion({at:Date.now(),by:me.name,from:old,to:n})})}
else{proj=$('pr1').value;pid=$('pr2').value;if(!pid){$('pr6').textContent='هذا المشروع ما بيه منتجات';return}var p=PRJ.filter(function(q){return q.id===proj})[0],m=p.products.filter(function(q){return q.id===pid})[0],rem=m.quantity-((p.pouredBy||{})[pid]||0);
if(n>rem&&!confirm('العدد أكبر من المتبقي ('+nf(Math.max(0,rem))+'). تكمل؟'))return;
ref=db.collection('pours').doc();bt.set(ref,{projectId:proj,projectName:p.name,productId:pid,productName:m.name,count:n,date:pdate,notes:notes,engineerId:me.uid,engineerName:me.name,createdAt:T,log:[]})}
var dl=n-old;if(dl!==0){var up={poured:F.increment(dl)};up['pouredBy.'+pid]=F.increment(dl);bt.update(db.doc('projects/'+proj),up)}
$('pr7').disabled=true;bt.commit().then(function(){$('pform').innerHTML='';toast('تم حفظ الصبة')}).catch(function(z){$('pr6').textContent=errAr(z);$('pr7').disabled=false})}}
function initSubmit(){if(!DS.date)DS.date=today();$('pt').innerHTML='<div class="row" id="stb" style="margin-bottom:12px"></div><div id="shd"></div>';stabs();$('vb').onclick=sClick;$('vb').onchange=sChange;$('vb').oninput=sInput}
function stabs(){$('stb').innerHTML=[['n','رفع جديد'],['m','استحقاقاتي']].map(function(t){return '<button class="btn sm'+(sstab===t[0]?' p':'')+'" data-st="'+t[0]+'">'+t[1]+'</button>'}).join('');
$('stb').onclick=function(e){var b=e.target.closest('button');if(b){sstab=b.dataset.st;stabs();drawSubmit()}};
var P=PRJ.filter(function(p){return !p.archived&&(p.status||'active')==='active'});
$('shd').innerHTML=sstab==='n'?'<div class="fg c2" style="margin-bottom:12px"><label>التاريخ<input type="date" id="sd1" value="'+DS.date+'"></label><label>المشروع<select class="sel" id="sp1"><option value="">— بدون —</option>'+P.map(function(p){return '<option value="'+p.id+'"'+(p.id===DS.project?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></label></div>':'';
$('shd').onchange=sChange}
function selCount(){return Object.keys(DS.sel).filter(function(k){return DS.sel[k].on}).length}
function selTotal(){return Object.keys(DS.sel).reduce(function(t,k){var s=DS.sel[k];return t+(s.on?(+s.wage||0):0)},0)}
function sBar(){var n=selCount();return '<div class="sbar"><div><b id="sbn">'+n+' عامل</b><div class="mu" style="font-size:13px" id="sbt">المجموع: '+nf(selTotal())+' د.ع</div></div><button class="btn p" id="srev"'+(n?'':' disabled')+'>مراجعة ورفع</button></div>'}
function drawSubmit(){if(!$('vb'))return;if(sstab==='n'&&$('sp1')&&$('sp1').options.length<=1&&PRJ.length)stabs();
var a=document.activeElement;if(a&&a.closest&&a.closest('#vb')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
if(sstab==='m'){drawMyDues();return}if(DS.rev){drawReview();return}DS.cat?drawSWorkers():drawSCats()}
function drawSCats(){var C=CATS.filter(function(c){return !c.archived});
$('vb').innerHTML=(C.length?'<div class="grid ug">'+C.map(function(c){var ws=WRK.filter(function(w){return !w.archived&&w.status==='working'&&w.categoryId===c.id}),sc=ws.filter(function(w){return DS.sel[w.id]&&DS.sel[w.id].on}).length;return '<div class="card pc cc" data-cat="'+c.id+'" tabindex="0" role="button"><div class="prow"><b><i class="pd" style="display:inline-block;background:'+esc(c.color)+'"></i> '+esc(c.name)+'</b>'+(sc?'<span class="chip">'+sc+' معلَّم</span>':'')+'</div><div class="mu" style="font-size:13px">'+ws.length+' عامل</div></div>'}).join('')+'</div>':empty('ماكو فئات','المدير يضيفها من صفحة العمال والفئات.'))+sBar()}
function wRow(w){var s=DS.sel[w.id],on=s&&s.on,chg=on&&(+s.wage)!==(+w.wage);
return '<div class="card wr'+(chg?' chg':'')+'" id="wr-'+w.id+'"><label class="ck" style="border:0;padding:0"><input type="checkbox" data-wc="'+w.id+'"'+(on?' checked':'')+'><span>'+esc(w.name)+'</span><small class="mu" style="margin-inline-start:auto">'+nf(w.wage)+' د.ع</small></label>'
+(on?'<div class="fg c2"><label>الوقت (اختياري)<input type="number" min="0" step="any" inputmode="decimal" data-wt="'+w.id+'" value="'+esc(s.time)+'" placeholder="أيام أو ساعات"></label><label>الأجرة<input type="number" min="0" step="any" inputmode="decimal" data-ww="'+w.id+'" value="'+esc(s.wage)+'"></label></div><label>ملاحظة <span class="rq" id="rq-'+w.id+'">'+(chg?'*':'')+'</span><input type="text" data-wn="'+w.id+'" value="'+esc(s.note)+'" placeholder="اختياري، وإلزامي إذا غيّرت الأجرة"></label>':'')+'</div>'}
function drawSWorkers(){var c=catOf(DS.cat),ws=WRK.filter(function(w){return !w.archived&&w.status==='working'&&w.categoryId===DS.cat});
$('vb').innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:12px"><button class="btn sm" id="sback">رجوع للفئات</button><b>'+esc(c?c.name:'')+'</b><button class="btn sm" id="sall">تحديد الكل</button></div>'+(ws.length?'<div style="display:grid;gap:10px">'+ws.map(wRow).join('')+'</div>':empty('ماكو عمال بهالفئة',''))+sBar()}
function selW(w,on){if(!w)return;var s=DS.sel[w.id];if(!s)s=DS.sel[w.id]={on:false,time:'',wage:w.wage,note:''};s.on=on}
function sClick(e){var t=e.target,b=t.closest('button'),c=t.closest('[data-cat]');
if(c&&!b){DS.cat=c.dataset.cat;drawSubmit();return}if(!b)return;
if(b.id==='sback'){DS.cat=null;drawSubmit()}
else if(b.id==='sall'){WRK.filter(function(w){return !w.archived&&w.status==='working'&&w.categoryId===DS.cat}).forEach(function(w){selW(w,true)});drawSWorkers()}
else if(b.id==='srev')reviewS();else if(b.id==='sbk'){DS.rev=false;drawSubmit()}else if(b.id==='ssend')sendDues()}
function sChange(e){var i=e.target;if(i.dataset.wc){selW(wk(i.dataset.wc),i.checked);drawSWorkers();return}
if(i.id==='sd1')DS.date=i.value||today();if(i.id==='sp1')DS.project=i.value}
function sInput(e){var i=e.target,id=i.dataset.wt||i.dataset.ww||i.dataset.wn;if(!id)return;var s=DS.sel[id],w=wk(id);if(!s||!w)return;
if(i.dataset.wt)s.time=i.value;if(i.dataset.ww)s.wage=i.value;if(i.dataset.wn)s.note=i.value;
var chg=(+s.wage)!==(+w.wage);$('wr-'+id).classList.toggle('chg',chg);$('rq-'+id).textContent=chg?'*':'';$('sbn').textContent=selCount()+' عامل';$('sbt').textContent='المجموع: '+nf(selTotal())+' د.ع'}
function onIds(){return Object.keys(DS.sel).filter(function(k){return DS.sel[k].on&&wk(k)})}
function reviewS(){var bad='',need=false;
onIds().forEach(function(k){var w=wk(k),s=DS.sel[k],c=catOf(w.categoryId);if(c&&c.needsProject!==false)need=true;
if(s.wage===''||!(+s.wage>=0))bad=bad||'اكتب أجرة صحيحة للعامل '+w.name;
if((+s.wage)!==(+w.wage)&&(s.note||'').trim().length<3)bad=bad||'اكتب سبب تغيير الأجرة للعامل '+w.name+' (3 أحرف على الأقل)'});
if(need&&!DS.project)bad=bad||'اختر المشروع';
if(bad){toast(bad);return}
var dup=[];MD.filter(function(d){return d.date===DS.date&&(d.projectId||'')===(DS.project||'')}).forEach(function(d){(d.workerIds||[]).forEach(function(k){if(DS.sel[k]&&DS.sel[k].on&&wk(k)&&dup.indexOf(wk(k).name)<0)dup.push(wk(k).name)})});
DS.dup=dup;DS.rev=true;drawSubmit()}
function drawReview(){var G={},tot=0,ids=onIds(),pj=PRJ.filter(function(q){return q.id===DS.project})[0];
ids.forEach(function(k){var w=wk(k);(G[w.categoryId]=G[w.categoryId]||[]).push(w)});
var h='<div class="card pc"><b>مراجعة الاستحقاق</b><div class="kv">'+kv('التاريخ',DS.date)+kv('المشروع',pj?pj.name:'بدون مشروع')+'</div></div>';
Object.keys(G).forEach(function(cid){var c=catOf(cid)||{},sub=0;h+='<div class="card pc" style="margin-top:12px"><b>'+esc(c.name||'')+'</b>'+G[cid].map(function(w){var s=DS.sel[w.id],wg=+s.wage;sub+=wg;return '<div><div class="prow"><span>'+esc(w.name)+(wg!==+w.wage?' <span class="chip off">أجرة معدّلة</span>':'')+'</span><b>'+nf(wg)+'</b></div>'+(s.time!==''?'<div class="mu" style="font-size:12px">الوقت: '+esc(s.time)+'</div>':'')+(s.note?'<div class="mu" style="font-size:12px">'+esc(s.note)+'</div>':'')+'</div>'}).join('')+'<div class="prow mu"><span>المجموع</span><b>'+nf(sub)+'</b></div></div>';tot+=sub});
$('vb').innerHTML=h+(DS.dup.length?'<div class="card pc" style="margin-top:12px;border-color:#f59e0b"><b>تنبيه: تكرار</b><span class="mu">هؤلاء انرفعلهم استحقاق بنفس اليوم والمشروع: '+esc(DS.dup.join('، '))+'</span></div>':'')+'<div class="sbar"><div><b>'+ids.length+' عامل</b><div class="mu" style="font-size:13px">المجموع: '+nf(tot)+' د.ع</div></div><div class="row"><button class="btn" id="sbk">رجوع</button><button class="btn p" id="ssend">تأكيد الرفع</button></div></div>'}
function sendDues(){var b=$('ssend');b.disabled=true;var F=firebase.firestore.FieldValue,bt=db.batch(),ref=db.collection('dues').doc(),ids=onIds(),tot=0,pj=PRJ.filter(function(q){return q.id===DS.project})[0];
ids.forEach(function(k){var w=wk(k),s=DS.sel[k],c=catOf(w.categoryId),wg=+s.wage;tot+=wg;bt.set(ref.collection('items').doc(),{workerId:k,workerName:w.name,categoryId:w.categoryId,categoryName:c?c.name:'',registeredWage:w.wage,wage:wg,time:s.time===''?null:+s.time,note:(s.note||'').trim()})});
bt.set(ref,{engineerId:me.uid,engineerName:me.name,projectId:DS.project||'',projectName:pj?pj.name:'',date:DS.date,status:'submitted',total:tot,count:ids.length,workerIds:ids,createdAt:F.serverTimestamp()});
bt.commit().then(function(){DS.sel={};DS.cat=null;DS.rev=false;DS.dup=[];sstab='m';stabs();drawSubmit();toast('تم رفع الاستحقاق للتدقيق')}).catch(function(x){b.disabled=false;toast(errAr(x))})}
function drawMyDues(){$('vb').innerHTML=MD.length?'<div class="grid ug">'+MD.map(function(d){return '<div class="card pc"><div class="prow"><b>'+esc(d.date)+'</b><span class="chip off">'+esc(STL[d.status]||d.status)+'</span></div><div class="mu" style="font-size:13px">'+esc(d.projectName||'بدون مشروع')+'</div><div class="kv">'+kv('عدد العمال',String(d.count))+kv('المجموع',nf(d.total)+' د.ع')+'</div></div>'}).join('')+'</div>':empty('ما رفعت استحقاقات بعد','')}
applyId(S);boot();
</script>
</body>
